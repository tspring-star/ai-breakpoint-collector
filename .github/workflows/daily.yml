name: Daily AI Breakpoint collector

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (1:17 AM Eastern), for the previous UTC day
  workflow_dispatch:
    inputs:
      date:
        description: "Day to collect (YYYY-MM-DD). Leave empty for yesterday."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the CVSS calculator
        run: pip install cvss==3.6

      - name: Pick the day
        id: day
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(date -u -d "yesterday" +%Y-%m-%d); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "year=${D:0:4}" >> "$GITHUB_OUTPUT"
          echo "prev=$(( ${D:0:4} - 1 ))" >> "$GITHUB_OUTPUT"

      - name: Download GitHub's Advisory Database (only the folders needed)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/github/advisory-database.git adb
          cd adb
          git sparse-checkout set advisories/github-reviewed \
            advisories/unreviewed/${{ steps.day.outputs.year }} \
            advisories/unreviewed/${{ steps.day.outputs.prev }}

      - name: Collect the day's AI candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect.py --db adb --date ${{ steps.day.outputs.date }}

      - name: Save the result
        run: |
          git config user.name "AI Breakpoint collector"
          git config user.email "actions@users.noreply.github.com"
          git add daily/
          git commit -m "Collect ${{ steps.day.outputs.date }}" || echo "Nothing new"
          git pull --rebase
          git push
